<header class="top"><h1>Quản lý học sinh</h1><p>Tra cứu và cập nhật thông tin học sinh, phụ huynh</p></header>
<main class="wrap">

<div class="stats" id="stats"></div><section id="list" class="list"></section>

</main>

const DB_NAME='student-manager-db', STORE='records';
let db, students=[], editingId=null, uploadedPhoto='';
const $=id=>document.getElementById(id);
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE,{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function all(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(x){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function init(){db=await openDB();students=await all();if(!students.length){for(const x of INITIAL)await put(x);students=await all()}render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return esc((n||'?').trim().split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase())}
function img(url,cls=''){return url?`<img class="${cls}" src="${esc(url)}" onerror="this.outerHTML='<div class=&quot;avatar&quot;>👤</div>'">`:`<div class="avatar ${cls}">👤</div>`}
function render(){let q=$('search').value.trim().toLocaleLowerCase('vi');let filtered=students.filter(s=>[s.name,s.phone,s.fatherPhone,s.motherPhone].join(' ').toLocaleLowerCase('vi').includes(q));$('stats').textContent=`Hiển thị ${filtered.length}/${students.length} học sinh`; $('list').innerHTML=filtered.length?filtered.map(s=>`<article class="student" data-id="${esc(s.id)}">${img(s.photo)}<div><h3>${esc(s.name)}</h3><p>☎ ${esc(s.phone||'Chưa có SĐT học sinh')}</p><p>${esc(s.address||'Chưa có địa chỉ')}</p></div></article>`).join(''):'<div class="empty">Không tìm thấy học sinh phù hợp.</div>';document.querySelectorAll('.student').forEach(el=>el.onclick=()=>showDetail(el.dataset.id))}
function byId(id){return students.find(s=>s.id===id)}
function showDetail(id){let s=byId(id);if(!s)return;$('detail').innerHTML=`<div class="detail-head">${img(s.photo)}<div><h2>${esc(s.name)}</h2><p>Mã số: ${esc(s.id)}</p></div></div><div class="fields">
${row('Điện thoại học sinh',s.phone)}${row('Địa chỉ',s.address,true)}${row('Họ tên ba',s.father)}${row('SĐT ba',s.fatherPhone)}${row('Họ tên mẹ',s.mother)}${row('SĐT mẹ',s.motherPhone)}
</div><div class="actions"><button class="btn" id="editCurrent">Sửa thông tin</button><button class="btn danger" id="deleteCurrent">Xóa học sinh</button></div>`;$('detailModal').style.display='block';$('editCurrent').onclick=()=>{closeDetail();openEdit(s)};$('deleteCurrent').onclick=async()=>{if(confirm('Bạn có chắc muốn xóa học sinh '+s.name+'?')){await del(s.id);students=await all();closeDetail();render()}}}
function row(label,value,full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><div>${esc(value||'—')}</div></div>`}
function closeDetail(){$('detailModal').style.display='none'}
function openEdit(s=null){editingId=s?.id||null;uploadedPhoto='';$('studentForm').reset();$('preview').classList.add('hide');$('formTitle').textContent=s?'Cập nhật học sinh':'Thêm học sinh';if(s)for(let k of ['name','phone','address','father','fatherPhone','mother','motherPhone','photo'])$('studentForm').elements[k].value=s[k]||'';$('editModal').style.display='block'}
function closeEdit(){$('editModal').style.display='none'}
$('search').addEventListener('input',render);$('add').onclick=()=>openEdit();$('closeDetail').onclick=closeDetail;$('closeEdit').onclick=closeEdit;$('cancelEdit').onclick=closeEdit;
$('photoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{uploadedPhoto=reader.result;$('preview').src=uploadedPhoto;$('preview').classList.remove('hide')};reader.readAsDataURL(f)};
$('studentForm').onsubmit=async e=>{e.preventDefault();let f=e.target;let old=editingId?byId(editingId):null;let id=editingId||String(Date.now());let s={id,name:f.elements.name.value.trim(),phone:f.elements.phone.value.trim(),address:f.elements.address.value.trim(),father:f.elements.father.value.trim(),fatherPhone:f.elements.fatherPhone.value.trim(),mother:f.elements.mother.value.trim(),motherPhone:f.elements.motherPhone.value.trim(),photo:uploadedPhoto||f.elements.photo.value.trim()||(old?.photo||'')};await put(s);students=await all();closeEdit();render()};
$('backup').onclick=()=>{let blob=new Blob([JSON.stringify(students,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sao_luu_hoc_sinh.json';a.click();URL.revokeObjectURL(a.href)};
$('restoreBtn').onclick=()=>$('restore').click();$('restore').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let arr=JSON.parse(await file.text());if(!Array.isArray(arr))throw Error();if(confirm('Nhập dữ liệu sẽ thay thế danh sách hiện tại. Tiếp tục?')){let tx=db.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);st.clear();arr.forEach(x=>st.put(x));tx.oncomplete=async()=>{students=await all();render();alert('Đã nhập dữ liệu thành công')}}}catch{alert('Tệp sao lưu không hợp lệ')}e.target.value=''};
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});\ninit().catch(e=>alert('Không thể khởi tạo dữ liệu: '+e.message));
</script></body></html>
